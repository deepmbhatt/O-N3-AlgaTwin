services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - algatwin_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ALGATWIN_MODEL_DIR: /app/models
      ALGATWIN_STREAM_CSV: /app/data/pond_iot_stream.csv
      ALGATWIN_MONGODB_URI: mongodb://mongo:27017
      ALGATWIN_MONGODB_DATABASE: algatwin
      ALGATWIN_API_KEY: ${ALGATWIN_API_KEY:-}
      ALGATWIN_CORS_ORIGINS: ${ALGATWIN_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  algatwin_mongo:
